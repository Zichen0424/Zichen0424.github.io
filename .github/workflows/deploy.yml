name: Deploy Hexo to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run clean && npm run build

      - name: Prepare GitHub Pages files
        run: |
          touch public/.nojekyll
          printf 'www.lain04.me\n' > public/CNAME

      - name: Deploy to GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git -C public init
          git -C public config user.name 'github-actions[bot]'
          git -C public config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C public add --all
          git -C public commit -m "Deploy ${GITHUB_SHA}"
          git -C public push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
